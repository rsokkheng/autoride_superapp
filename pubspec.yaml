name: autoride_superapp
description: AutoRide Super App - Automobile, Ride-Hailing & Delivery
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  path_provider: any
  # Maps & location
  google_maps_flutter: ^2.6.0
  google_maps_flutter_android: ^2.19.10
  geolocator: ^11.0.0
  # Real-time tracking
  web_socket_channel: ^3.0.1
  # Push notifications
  flutter_local_notifications: ^17.2.2
  audioplayers: ^6.1.0
  # Permissions
  permission_handler: ^11.3.1
  # Media
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  # Sharing
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  # Networking & storage
  http: ^1.2.0
  shared_preferences: ^2.3.0
  flutter_dotenv: ^5.2.1
  # State management (theme toggle)
  provider: ^6.1.2
  # Biometric authentication
  local_auth: ^2.3.0
  # QR code display
  qr_flutter: ^4.1.0
  # Social login
  google_sign_in: ^6.2.2
  # HTTP multipart (already transitive but explicit for MediaType)
  http_parser: ^4.1.0
  # Crypto / device identity
  crypto: ^3.0.3
  uuid: ^4.4.0
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^10.1.2
  # Firebase
  cloud_firestore: ^6.6.0
  firebase_core: ^4.6.0
  firebase_auth: ^6.0.0
  firebase_messaging: ^16.0.0
  firebase_storage: ^13.0.4
  google_maps_flutter_platform_interface: ^2.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/library/icon_fa.png
    - assets/Delivery.png
    - assets/EVStation.png
    - assets/Family.png
    - assets/Rental.png
    - assets/ride.png
    - assets/MarketPlace.png
    - assets/Wallet.png
    - assets/Rewards.png
    - assets/Refer.png
    - assets/Safety.png
    - assets/sounds/booking.wav
    - assets/sounds/accepted.wav


