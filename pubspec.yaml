name: autoride_superapp
description: AutoRide Super App - Automobile, Ride-Hailing & Delivery
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  path_provider: any
  # Maps & location
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  # Real-time tracking
  web_socket_channel: ^3.0.1
  # Push notifications
  flutter_local_notifications: ^17.2.2
  # Permissions
  permission_handler: ^11.3.1
  # Networking & storage
  http: ^1.2.0
  shared_preferences: ^2.3.0
  flutter_dotenv: ^5.2.1
  # Firebase
  cloud_firestore: ^6.3.0
  firebase_core: ^4.6.0  
  firebase_auth: ^6.0.0
  firebase_messaging: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
